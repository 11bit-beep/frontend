<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선생님 회원가입</title>
  <link rel="stylesheet" href="teacher-signup.css">
</head>
<body>
  <div class="bbik-name">
    <h1 class="title">삑</h1>
    <p class="subtitle">선생님 회원가입</p>
  </div>

  <form method="post">
    <div class="input-group">
      <input type="text" id="user-name" name="name" autocomplete="name" placeholder=" " required>
      <label for="user-name">이름</label>
    </div>

    <div class="input-group">
      <input type="text" id="user-id" name="username" autocomplete="username" placeholder=" " required>
      <label for="user-id">ID</label>
    </div>

    <div class="input-group pw-wrap">
      <input type="password" id="pw-input" name="password" autocomplete="new-password" placeholder=" " required>
      <label for="pw-input">비밀번호</label>
      <button type="button" class="pw-toggle" data-target="pw-input" aria-label="비밀번호 보기">
        <img class="icon-eye" src="../assets/icons/eyeOpen.svg" alt="" aria-hidden="true">
        <img class="icon-eye-off" src="../assets/icons/eyeClosed.svg" alt="" aria-hidden="true" style="display:none">
      </button>
    </div>

    <div class="input-group pw-wrap">
      <input type="password" id="pw-confirm-input" autocomplete="new-password" placeholder=" " required>
      <label for="pw-confirm-input">비밀번호 확인</label>
      <button type="button" class="pw-toggle" data-target="pw-confirm-input" aria-label="비밀번호 보기">
        <img class="icon-eye" src="../assets/icons/eyeOpen.svg" alt="" aria-hidden="true">
        <img class="icon-eye-off" src="../assets/icons/eyeClosed.svg" alt="" aria-hidden="true" style="display:none">
      </button>
    </div>

    <button type="submit" disabled>가입하기</button>
  </form>

  <a href="../login/login.html" class="switch-link">로그인</a>
  <p class="test-msg" hidden>화면 테스트 중입니다. 실제 계정은 만들어지지 않습니다.</p>
  <p class="error-msg" role="alert"></p>

  <script type="module" src="teacher-signup.js"></script>
</body>
</html>
