<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <div class="bbik-name">
    <h1 class="title">삑</h1>
    <p class="subtitle">출결관리 시스템</p>
  </div>

  <form>
    <!-- 이름 입력 -->
    <div class="input-group">
      <input type="text" id="user-name" placeholder=" ">
      <label for="user-name">이름</label>
    </div>

    <!-- 학년/반/번호 select -->
    <div>
      <select>
        <option value="" disabled selected hidden>학년</option>
        <option value="1">1학년</option>
        <option value="2">2학년</option>
        <option value="3">3학년</option>
      </select>
      <select>
        <option value="" disabled selected hidden>반</option>
        <option value="1">1반</option>
        <option value="2">2반</option>
        <option value="3">3반</option>
      </select>
      <select>
        <option value="" disabled selected hidden>번호</option>
        <option value="1">1번</option>
        <option value="2">2번</option>
        <option value="3">3번</option>
        <option value="4">4번</option>
        <option value="5">5번</option>
        <option value="6">6번</option>
        <option value="7">7번</option>
        <option value="8">8번</option>
        <option value="9">9번</option>
        <option value="10">10번</option>
        <option value="11">11번</option>
        <option value="12">12번</option>
        <option value="13">13번</option>
        <option value="14">14번</option>
        <option value="15">15번</option>
        <option value="16">16번</option>
        <option value="17">17번</option>
        <option value="18">18번</option>
      </select>
    </div>

    <!-- ID 입력 -->
    <div class="input-group">
      <input type="text" id="user-id" placeholder=" ">
      <label for="user-id">ID</label>
    </div>

    <!-- 비밀번호 입력 -->
    <div class="input-group pw-wrap">
      <input type="password" id="pw-input" placeholder=" ">
      <label for="pw-input">비밀번호</label>
      <button type="button" class="pw-toggle" data-target="pw-input">
        <img class="icon-eye" src="../assets/icons/eyeOpen.svg" alt="" aria-hidden="true">
        <img class="icon-eye-off" src="../assets/icons/eyeClosed.svg" alt="" aria-hidden="true" style="display:none">
      </button>
    </div>

    <!-- 비밀번호 확인 입력 -->
    <div class="input-group pw-wrap">
      <input type="password" id="pw-confirm-input" placeholder=" ">
      <label for="pw-confirm-input">비밀번호 확인</label>
      <button type="button" class="pw-toggle" data-target="pw-confirm-input">
        <img class="icon-eye" src="../assets/icons/eyeOpen.svg" alt="" aria-hidden="true">
        <img class="icon-eye-off" src="../assets/icons/eyeClosed.svg" alt="" aria-hidden="true" style="display:none">
      </button>
    </div>

    <button type="submit">가입하기</button>
  </form>

  <a href="../login/login.html" class="switch-link">로그인</a>
  <p class="error-msg">비밀번호가 일치하지 않습니다.</p>

  <script src="signup.js"></script>
</body>
</html>
