<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="bbik-name">
    <h1 class="title">삑</h1>
    <p class="subtitle">출결관리 시스템</p>
  </div>

  <form>
    <!-- ID 입력 -->
    <div class="input-group">
      <input type="text" id="user-id" placeholder=" ">
      <label for="user-id">ID</label>
    </div>

    <!-- 비밀번호 입력 -->
    <div class="input-group pw-wrap">
      <input type="password" id="pw-input" placeholder=" ">
      <label for="pw-input">비밀번호</label>
      <button type="button" class="pw-toggle" data-target="pw-input">
        <svg class="icon-eye" width="20" height="20" viewBox="0 0 20 20" fill="#808080" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z" />
          <path fill-rule="evenodd" d="M.664 10.59a1.651 1.651 0 010-1.186A10.004 10.004 0 0110 3c4.257 0 7.893 2.66 9.336 6.41.147.381.146.804 0 1.186A10.004 10.004 0 0110 17c-4.257 0-7.893-2.66-9.336-6.41zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
        </svg>
        <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 20 20" fill="#808080" xmlns="http://www.w3.org/2000/svg" style="display:none">
          <path fill-rule="evenodd" d="M3.28 2.22a.75.75 0 00-1.06 1.06l14.5 14.5a.75.75 0 101.06-1.06l-1.745-1.745a10.029 10.029 0 003.3-4.38 1.651 1.651 0 000-1.185A10.004 10.004 0 009.999 3a9.956 9.956 0 00-4.744 1.194L3.28 2.22zM7.752 6.69l1.092 1.092a2.5 2.5 0 013.374 3.373l1.091 1.092a4 4 0 00-5.557-5.557z" clip-rule="evenodd" />
          <path d="M10.748 13.93l2.523 2.523a9.987 9.987 0 01-3.27.547c-4.258 0-7.894-2.66-9.337-6.41a1.651 1.651 0 010-1.186A10.007 10.007 0 012.839 6.02L6.07 9.252a4 4 0 004.678 4.678z" />
        </svg>
      </button>
    </div>

    <button type="submit">로그인</button>
  </form>

  <a href="signup.html" class="switch-link">회원가입</a>
  <p class="error-msg">아이디 혹은 비밀번호가 올바르지 않습니다.</p>

  <script src="login.js"></script>
</body>
</html>
